<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spatial Canvases | Computational Design Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single+Ink:wght@700&family=Space+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="stylesheet" href="spatial-canvases/spatial-canvases.css" />
  </head>
  <body class="spatial-page">
    <a class="home-button" href="index.html" aria-label="Go to homepage">
      <span class="home-icon" aria-hidden="true"></span>
    </a>
    <main class="page">
      <section class="canvas-section">
        <div id="static-canvas-container"></div>
        <button class="yolk-button" type="button">
          break the yolk
          <span class="yolk-button__handle yolk-button__handle--top-left" aria-hidden="true"></span>
          <span class="yolk-button__handle yolk-button__handle--top-right" aria-hidden="true"></span>
          <span class="yolk-button__handle yolk-button__handle--bottom-left" aria-hidden="true"></span>
          <span class="yolk-button__handle yolk-button__handle--bottom-right" aria-hidden="true"></span>
        </button>
      </section>

      <div class="section-divider" aria-hidden="true"></div>

      <section class="three-section" aria-label="3D spatial canvases">
        <div class="three-canvas-group">
          <p class="orbit-hint"><span class="orbit-icon" aria-hidden="true"></span>orbit to move</p>
          <div id="three-canvas-forms" class="three-canvas"></div>
        </div>
        <div class="three-canvas-group">
          <p class="orbit-hint"><span class="orbit-icon" aria-hidden="true"></span>orbit to move</p>
          <div id="three-canvas-light" class="three-canvas"></div>
        </div>
      </section>
    </main>

    <!-- This script loads Three.js from a CDN so the browser can use the THREE object. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- This script loads OrbitControls from a CDN so the 3D canvases can rotate. -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <!-- This script loads my custom Three.js sketch for #three-canvas-forms. -->
    <script src="spatial-canvases/three-breakfast-forms.js"></script>
    <script src="spatial-canvases/three-breakfast-light.js"></script>
    <script src="spatial-canvases/sketch-static.js"></script>
  </body>
</html>
